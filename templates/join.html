<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كلاك</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <div class="hero-card fade-in">
      <h1>كلاك</h1>
      <p class="subtext">اخدع أصدقاءك واختر الإجابة الصحيحة</p>
    </div>

    <div class="card slide-up">
      <div class="top-question-block">
        <div class="status-row">
          <span id="status-box" class="status-badge">—</span>
          <span id="timer-box" class="timer-badge">—</span>
        </div>
        <h2 class="question-title">السؤال الحالي</h2>
        <p id="question-box" class="question-box">بانتظار بدء اللعبة</p>
      </div>
    </div>

    <div class="card slide-up" id="join-section">
      <p><strong>رمز الغرفة:</strong> <span id="room-code">—</span></p>

      <form id="join-form">
        <label for="name">اسم اللاعب</label>
        <input type="text" id="name" name="name" placeholder="اكتب اسمك" maxlength="20" required />
        <button type="submit" class="btn-primary">انضمام</button>
      </form>

      <p id="join-message" class="message-box"></p>
    </div>

    <div class="card slide-up" id="submit-section" style="display:none;">
      <h2>اكتب إجابة تبدو صحيحة</h2>
      <form id="answer-form">
        <input type="text" id="fake-answer" maxlength="100" placeholder="اكتب إجابة مضللة" required />
        <button type="submit" class="btn-success">إرسال الإجابة</button>
      </form>
      <p id="answer-message" class="message-box"></p>
    </div>

    <div class="card slide-up" id="vote-section" style="display:none;">
      <h2>صوّت الآن</h2>
      <div id="vote-options"></div>
      <p id="vote-message" class="message-box"></p>
    </div>

    <div class="card slide-up">
      <h2>الترتيب والنقاط</h2>
      <ul id="players-list" class="scoreboard-list"></ul>
    </div>

    <div class="card slide-up" id="results-section" style="display:none;">
      <h2>نتائج الجولة</h2>
      <ul id="results-list" class="nice-list"></ul>
    </div>

    <div class="card slide-up" id="final-ranking-section" style="display:none;">
      <h2>الترتيب النهائي</h2>
      <ul id="final-ranking-list" class="scoreboard-list"></ul>
    </div>
  </div>

  <script>
    let playerId = localStorage.getItem('player_id') || '';
    let previousScores = {};

    async function refreshState() {
      const response = await fetch('/api/state');
      const state = await response.json();

      document.getElementById('room-code').textContent = state.room_code || '—';
      document.getElementById('status-box').textContent = state.status || '—';
      document.getElementById('question-box').textContent = state.question || 'بانتظار بدء اللعبة';
      document.getElementById('timer-box').textContent =
        state.remaining_seconds !== null && state.remaining_seconds !== undefined
          ? `${state.remaining_seconds} ثانية`
          : '—';

      document.getElementById('submit-section').style.display =
        state.status === 'SUBMIT' && playerId ? 'block' : 'none';

      document.getElementById('vote-section').style.display =
        state.status === 'VOTE' && playerId ? 'block' : 'none';

      document.getElementById('results-section').style.display =
        state.status === 'RESULTS' ? 'block' : 'none';

      document.getElementById('final-ranking-section').style.display =
        state.status === 'GAME_OVER' ? 'block' : 'none';

      renderScoreboard(state.players || []);
      renderResults(state.round_results || []);
      renderFinalRanking(state.final_ranking || []);

      if (state.status === 'VOTE') {
        renderVoteOptions(state.vote_options || []);
      }
    }

    function renderScoreboard(players) {
      const list = document.getElementById('players-list');
      list.innerHTML = '';

      if (!players.length) {
        list.innerHTML = '<li>لا يوجد لاعبون بعد</li>';
        return;
      }

      players.forEach((player, index) => {
        const oldScore = previousScores[player.id] ?? player.score;
        const scoreChanged = oldScore !== player.score;

        const li = document.createElement('li');
        li.className = 'scoreboard-item' + (scoreChanged ? ' score-pop' : '');
        li.innerHTML = `
          <div class="rank-badge">#${index + 1}</div>
          <div class="player-meta">
            <div class="player-name">${player.name}</div>
            <div class="player-score">${player.score} نقطة</div>
          </div>
        `;
        list.appendChild(li);

        previousScores[player.id] = player.score;
      });
    }

    function renderVoteOptions(options) {
      const box = document.getElementById('vote-options');
      box.innerHTML = '';

      if (!options.length) {
        box.innerHTML = '<p>لا توجد خيارات بعد</p>';
        return;
      }

      options.forEach(option => {
        const button = document.createElement('button');
        button.textContent = option.text;
        button.className = 'option-btn';
        button.onclick = async () => {
          const formData = new FormData();
          formData.append('player_id', playerId);
          formData.append('option_id', option.id);

          const response = await fetch('/player/submit-vote', {
            method: 'POST',
            body: formData
          });

          const result = await response.json();
          document.getElementById('vote-message').textContent =
            result.success ? 'تم إرسال التصويت' : (result.message || 'حدث خطأ');
        };
        box.appendChild(button);
      });
    }

    function renderResults(results) {
      const list = document.getElementById('results-list');
      list.innerHTML = '';

      if (!results.length) {
        list.innerHTML = '<li>لا توجد نتائج بعد</li>';
        return;
      }

      results.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.player_name}: ${item.action} (+${item.points})`;
        list.appendChild(li);
      });
    }

    function renderFinalRanking(players) {
      const list = document.getElementById('final-ranking-list');
      list.innerHTML = '';

      if (!players.length) {
        list.innerHTML = '<li>لا توجد نتائج نهائية بعد</li>';
        return;
      }

      players.forEach((player, index) => {
        const li = document.createElement('li');
        li.className = 'scoreboard-item final-rank';
        li.innerHTML = `
          <div class="rank-badge">#${index + 1}</div>
          <div class="player-meta">
            <div class="player-name">${player.name}</div>
            <div class="player-score">${player.score} نقطة</div>
          </div>
        `;
        list.appendChild(li);
      });
    }

    document.getElementById('join-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const formData = new FormData();
      formData.append('name', document.getElementById('name').value);

      const response = await fetch('/player/join', {
        method: 'POST',
        body: formData
      });

      const result = await response.json();

      if (result.success) {
        playerId = result.player.id;
        localStorage.setItem('player_id', playerId);
        document.getElementById('join-message').textContent = 'تم الانضمام بنجاح';
        document.getElementById('join-form').style.display = 'none';
      } else {
        document.getElementById('join-message').textContent = result.message || 'حدث خطأ';
      }
    });

    document.getElementById('answer-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const formData = new FormData();
      formData.append('player_id', playerId);
      formData.append('answer', document.getElementById('fake-answer').value);

      const response = await fetch('/player/submit-answer', {
        method: 'POST',
        body: formData
      });

      const result = await response.json();
      document.getElementById('answer-message').textContent =
        result.success ? 'تم إرسال الإجابة' : (result.message || 'حدث خطأ');

      if (result.success) {
        document.getElementById('fake-answer').value = '';
      }
    });

    setInterval(refreshState, 1000);
    refreshState();
  </script>
</body>
</html>
